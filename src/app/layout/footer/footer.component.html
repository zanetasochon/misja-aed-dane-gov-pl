<footer class="page-footer outline-light" id="main-footer" tabindex="-1">
  <!-- navigation -->
  <cms-landing-page context="footer" [widgetFooterSubject]="cmsFooterNavigationPage"></cms-landing-page>

  <!-- LOGOs -->
  <div class="external-logos">
    <cms-block2
      class="pt-3 pb-3 external-logos--cms-block external-logos--cms-block__elements-{{
        (cmsFooterLogoSection | async)?.length
      }}"
      [widgetsSubject]="cmsFooterLogoSection"
      [isFooterLogos]="true"
      [isFullWidth]="true"></cms-block2>
  </div>

  <ng-template #rodoModalTemplate>
    <app-rodo-modal (isModalClosed)="rodoModalClose()"></app-rodo-modal>
  </ng-template>


  <!-- HackNation 2026 (zmiana 2026-11-21, 2026-11-22): zastrzeżenie, informacja o licencji GPL-3.0 (§5d) i link do kodu -->
  <div class="container py-3 text-center" lang="pl">
    <p class="mb-1">Prototyp HackNation 2026. Nie jest to oficjalny portal dane.gov.pl.</p>
    <p class="mb-0">
      Kod: <a href="https://github.com/zanetasochon/misja-aed-dane-gov-pl/blob/main/COPYING">GNU GPL v3.0</a>, bez gwarancji. Zmiany opisane w
      <a href="https://github.com/zanetasochon/misja-aed-dane-gov-pl/blob/main/ZMIANY-HACKNATION.md">ZMIANY-HACKNATION.md</a>.
      <a href="https://github.com/zanetasochon/misja-aed-dane-gov-pl">Kod źródłowy prototypu</a>
    </p>
  </div>

  <div hidden>version: {{ currentVersion }}</div>
</footer>
